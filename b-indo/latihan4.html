<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal Bahasa Indonesia SMP Kelas 7 Semester 1</title>
<style>
  :root {
    --primary: #1e40af;
    --primary-light: #dbeafe;
    --primary-hover: #1d4ed8;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #475569;
    --border: #cbd5e1;
    --success: #15803d;
    --success-bg: #dcfce7;
    --danger: #b91c1c;
    --danger-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #fff;
    padding: 18px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
  }
  header .subtitle {
    font-size: 0.85rem;
    opacity: 0.9;
  }
  .status-badge {
    background: rgba(255,255,255,0.18);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .main-layout {
    max-width: 1240px;
    margin: 24px auto;
    padding: 0 18px;
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }
  .questions-col {
    flex: 1;
    min-width: 0;
  }
  /* Sidebar Navigasi Nomor Tetap (Sticky) */
  .sidebar-col {
    width: 290px;
    flex-shrink: 0;
    position: sticky;
    top: 84px;
    background: var(--card);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    border: 1px solid var(--border);
    max-height: calc(100vh - 104px);
    overflow-y: auto;
  }
  .sidebar-title {
    font-weight: 700;
    font-size: 0.95rem;
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-bottom: 14px;
  }
  .nav-btn {
    height: 36px;
    border: 1px solid var(--border);
    background: #f8fafc;
    color: var(--text);
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .nav-btn:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .nav-btn.answered {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .nav-btn.correct-nav {
    background: var(--success) !important;
    color: #fff !important;
    border-color: var(--success) !important;
  }
  .nav-btn.wrong-nav {
    background: var(--danger) !important;
    color: #fff !important;
    border-color: var(--danger) !important;
  }
  .legend {
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    display: inline-block;
  }
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover { background: #15803d; }
  .btn-reset {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background: #475569;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: none;
  }
  .btn-reset:hover { background: #334155; }

  /* Kartu Hasil Skor */
  #score-panel {
    display: none;
    background: var(--card);
    border: 2px solid var(--primary);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(30, 64, 175, 0.12);
    text-align: center;
  }
  .score-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 0 auto 12px auto;
    border: 4px solid var(--primary);
  }
  .score-num {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1.1;
  }
  .score-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .score-stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 12px;
    flex-wrap: wrap;
    font-weight: 600;
    font-size: 0.92rem;
  }

  /* Kartu Soal */
  .q-card {
    background: var(--card);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    border: 1px solid var(--border);
    scroll-margin-top: 90px;
  }
  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .q-num {
    background: var(--primary);
    color: #fff;
    padding: 4px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.88rem;
  }
  .q-kisi {
    font-size: 0.78rem;
    color: var(--muted);
    background: #f1f5f9;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .soal-svg {
    width: 100%;
    max-width: 440px;
    height: auto;
    display: block;
    margin: 12px 0 14px 0;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .q-text {
    font-size: 1rem;
    margin-bottom: 14px;
    color: var(--text);
  }
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    background: #fff;
  }
  .option-item:hover {
    border-color: var(--primary);
    background: #f8fafc;
  }
  .option-item input[type="radio"] {
    margin-top: 4px;
    accent-color: var(--primary);
    transform: scale(1.15);
    cursor: pointer;
  }
  .opt-letter {
    font-weight: 700;
    min-width: 20px;
  }
  .option-item.selected {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .option-item.correct-opt {
    border-color: var(--success) !important;
    background: var(--success-bg) !important;
    color: #14532d;
    font-weight: 600;
  }
  .option-item.wrong-opt {
    border-color: var(--danger) !important;
    background: var(--danger-bg) !important;
    color: #7f1d1d;
  }
  .explanation-box {
    display: none;
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 0.92rem;
    border-left: 4px solid var(--primary);
    background: #f8fafc;
  }
  .explanation-box.exp-correct {
    border-left-color: var(--success);
    background: #f0fdf4;
  }
  .explanation-box.exp-wrong {
    border-left-color: var(--danger);
    background: #fef2f2;
  }
  @media (max-width: 860px) {
    .main-layout {
      flex-direction: column-reverse;
    }
    .sidebar-col {
      width: 100%;
      position: static;
      max-height: none;
    }
    .nav-grid {
      grid-template-columns: repeat(10, 1fr);
    }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Latihan Soal Bahasa Indonesia — SMP Kelas 7 (Semester 1)</h1>
    <div class="subtitle">Kurikulum Merdeka • 50 Soal Pilihan Ganda • Mode Offline Interaktif</div>
  </div>
  <div class="status-badge" id="progress-badge">Terjawab: 0 / 50</div>
</header>

<div class="main-layout">
  <div class="questions-col">
    <div id="score-panel">
      <div class="score-circle">
        <div class="score-num" id="final-score">0</div>
        <div class="score-label">Skor Akhir</div>
      </div>
      <h2 id="score-title" style="margin: 0 0 6px 0;">Hasil Latihan Anda</h2>
      <p id="score-desc" style="margin: 0; color: var(--muted);"></p>
      <div class="score-stats">
        <span style="color: var(--success);" id="stat-correct">Benar: 0</span>
        <span style="color: var(--danger);" id="stat-wrong">Salah: 0</span>
        <span style="color: var(--muted);" id="stat-empty">Kosong: 0</span>
      </div>
    </div>

    <div id="quiz-container"></div>
  </div>

  <aside class="sidebar-col">
    <div class="sidebar-title">
      <span>Navigasi Nomor Soal</span>
      <span id="side-count" style="font-size:0.82rem; color:var(--primary);">0/50</span>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#f8fafc; border:1px solid #cbd5e1;"></i> Belum</span>
      <span><i class="dot" style="background:var(--primary);"></i> Sudah</span>
      <span><i class="dot" style="background:var(--success);"></i> Benar</span>
      <span><i class="dot" style="background:var(--danger);"></i> Salah</span>
    </div>
    <div class="nav-grid" id="nav-grid"></div>
    <button type="button" class="btn-submit" id="btn-submit" onclick="submitQuiz()">Kumpulkan &amp; Lihat Skor</button>
    <button type="button" class="btn-reset" id="btn-reset" onclick="resetQuiz()">Ulangi Latihan</button>
  </aside>
</div>

<script>
const SVGS = {"pantai": "<svg viewBox=\"0 0 360 150\" xmlns=\"http://www.w3.org/2000/svg\" class=\"soal-svg\">\n  <rect width=\"360\" height=\"85\" fill=\"#7dd3fc\"/>\n  <circle cx=\"300\" cy=\"35\" r=\"20\" fill=\"#fde047\"/>\n  <path d=\"M0 85 Q90 78 180 85 T360 85 L360 115 L0 115 Z\" fill=\"#0284c7\"/>\n  <path d=\"M0 110 Q120 102 240 110 T360 110 L360 150 L0 150 Z\" fill=\"#fde68a\"/>\n  <path d=\"M45 115 Q50 75 60 55\" stroke=\"#78350f\" stroke-width=\"5\" fill=\"none\"/>\n  <path d=\"M60 55 Q35 45 25 60 M60 55 Q40 35 65 32 M60 55 Q85 40 90 58 M60 55 Q80 60 72 72\" stroke=\"#15803d\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/>\n  <text x=\"15\" y=\"25\" font-size=\"11\" fill=\"#0369a1\" font-weight=\"bold\">Ilustrasi: Suasana Pantai Parangtritis</text>\n</svg>", "candi": "<svg viewBox=\"0 0 360 150\" xmlns=\"http://www.w3.org/2000/svg\" class=\"soal-svg\">\n  <rect width=\"360\" height=\"150\" fill=\"#e0f2fe\"/>\n  <rect x=\"0\" y=\"125\" width=\"360\" height=\"25\" fill=\"#86efac\"/>\n  <rect x=\"80\" y=\"105\" width=\"200\" height=\"20\" fill=\"#78716c\" stroke=\"#44403c\"/>\n  <rect x=\"105\" y=\"85\" width=\"150\" height=\"20\" fill=\"#a8a29e\" stroke=\"#44403c\"/>\n  <rect x=\"130\" y=\"65\" width=\"100\" height=\"20\" fill=\"#78716c\" stroke=\"#44403c\"/>\n  <polygon points=\"155,65 180,25 205,65\" fill=\"#57534e\"/>\n  <circle cx=\"135\" cy=\"58\" r=\"7\" fill=\"#57534e\"/>\n  <circle cx=\"225\" cy=\"58\" r=\"7\" fill=\"#57534e\"/>\n  <text x=\"15\" y=\"22\" font-size=\"11\" fill=\"#334155\" font-weight=\"bold\">Ilustrasi: Candi Borobudur yang Megah</text>\n</svg>", "fantasi": "<svg viewBox=\"0 0 360 150\" xmlns=\"http://www.w3.org/2000/svg\" class=\"soal-svg\">\n  <rect width=\"360\" height=\"150\" fill=\"#1e1b4b\"/>\n  <circle cx=\"60\" cy=\"35\" r=\"2\" fill=\"#fff\"/><circle cx=\"120\" cy=\"25\" r=\"2.5\" fill=\"#fef08a\"/><circle cx=\"290\" cy=\"40\" r=\"2\" fill=\"#fff\"/>\n  <ellipse cx=\"180\" cy=\"80\" rx=\"45\" ry=\"55\" fill=\" "28\" r=\"2\" fill=\"#0284c7\"/><circle cx=\"38\" cy=\"34\" r=\"2\" fill=\"#0284c7\"/>\n    <text x=\"32\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">4. Siram Air</text>\n  </g>\n</svg>", "prosedur_cuci": "<svg viewBox=\"0 0 360 140\" xmlns=\"http://www.w3.org/2000/svg\" class=\"soal-svg\">\n  <rect width=\"360\" height=\"140\" fill=\"#ecfeff\"/>\n  <circle cx=\"65\" cy=\"70\" r=\"32\" fill=\"#bae6fd\" stroke=\"#0284c7\" stroke-width=\"2\"/>\n  <text x=\"65\" y=\"67\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\" fill=\"#0369a1\">Basahi</text>\n  <text x=\"65\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#0369a1\">&amp; Sabuni</text>\n  <path d=\"M105 70 L135 70\" stroke=\"#0284c7\" stroke-width=\"2.5\" marker-end=\"url(#arr)\"/>\n  <circle cx=\"180\" cy=\"70\" r=\"32\" fill=\"#fef08a\" stroke=\"#ca8a04\" stroke-width=\"2\"/>\n  <text x=\"180\" y=\"67\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\" fill=\"#854d0e\">Gosok Sela</text>\n  <text x=\"180\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#854d0e\">20 Detik</text>\n  <path d=\"M220 70 L250 70\" stroke=\"#0284c7\" stroke-width=\"2.5\"/>\n  <circle cx=\"295\" cy=\"70\" r=\"32\" fill=\"#bbf7d0\" stroke=\"#16a34a\" stroke-width=\"2\"/>\n  <text x=\"295\" y=\"67\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\" fill=\"#166534\">Bilas &amp;</text>\n  <text x=\"295\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"#166534\">Keringkan</text>\n</svg>"};
const QUESTIONS = [{"no": 1, "kisi": "Teks Deskripsi", "svg": "", "q": "Paragraf yang bertujuan menggambarkan suatu objek, tempat, atau peristiwa secara terperinci sehingga pembaca seolah-olah dapat melihat, mendengar, dan merasakan sendiri objek yang digambarkan disebut ....", "options": ["Teks laporan percobaan", "Teks narasi fantasi", "Teks prosedur", "Teks deskripsi"], "ans": 3, "exp": "Teks deskripsi adalah teks yang melukiskan atau menggambarkan suatu objek secara rinci dan konkret sehingga melibatkan pancaindra pembaca seakan-akan mengalaminya langsung."}, {"no": 2, "kisi": "Topik Teks Deskripsi", "svg": "pantai", "q": "Perhatikan kutipan teks berikut!<br><em>\"Pantai Parangtritis memanjang dari ujung timur yang dibatasi oleh tebing pegunungan ke arah barat hingga pantai-pantai selanjutnya. Pemandangan pantai ini sangat mem memesona dengan hamparan pasir hitam yang berkilau diterpa sinar matahari sore.\"</em><br>Topik utama yang dibahas dalam kutipan teks deskripsi tersebut adalah ....", "options": ["Cara menuju wisata Pantai Parangtritis", "Kegiatan nelayan di pesisir pantai selatan", "Keindahan pemandangan Pantai Parangtritis", "Asal-usul sejarah tebing di Parangtritis"], "ans": 2, "exp": "Kutipan teks berfokus menggambarkan kondisi geografis dan pesona keindahan alam Pantai Parangtritis saat sore hari."}, {"no": 3, "kisi": "Pancaindra dalam Teks Deskripsi", "svg": "", "q": "Bacalah kalimat berikut!<br><em>\"Deburan ombak memecah karang terdengar bersahut-sahutan memecah keheningan senja.\"</em><br>Kalimat perincian tersebut seolah-olah melibatkan citraan pancaindra ....", "options": ["Pendengaran", "Pengecapan", "Penciuman", "Penglihatan"], "ans": 0, "exp": "Kata 'deburan ombak ... terdengar bersahut-sahutan' merangsang indra pendengaran pembaca."}, {"no": 4, "kisi": "Struktur Identifikasi", "svg": "candi", "q": "Bacalah penggalan teks berikut!<br><em>\"Candi Borobudur merupakan salah satu keajaiban dunia yang terletak di Kabupaten Magelang, Jawa Tengah. Candi bercorak Buddha ini dibangun pada masa Dinasti Syailendra pada abad ke-8 Masehi.\"</em><br>Berdasarkan struktur teks deskripsi, paragraf tersebut termasuk bagian ....", "options": ["Orientasi cerita", "Simpulan atau kesan", "Deskripsi bagian", "Identifikasi (gambaran umum)"], "ans": 3, "exp": "Bagian identifikasi berisi pengenalan nama objek, lokasi, sejarah singkat, dan gambaran umum objek yang dideskripsikan."}, {"no": 5, "kisi": "Tema Teks Deskripsi", "svg": "", "q": "Bacalah kutipan teks berikut!<br><em>\"Setiap sudut ruang kelas VII-A tertata sangat rapi. Dindingnya dicat warna hijau pastel yang menyejukkan mata. Di bagian belakang terdapat pojok baca dengan rak kayu berisi ratusan buku cerita dan ensiklopedia.\"</em><br>Tema yang diangkat dalam teks deskripsi tersebut adalah ....", "options": ["Kegemaran membaca di rumah", "Wisata edukasi perpustakaan kota", "Pelestarian budaya daerah", "Lingkungan sekolah yang nyaman"], "ans": 3, "exp": "Objek yang digambarkan adalah ruang kelas VII-A beserta fasilitas pojok bacanya, sehingga temanya berkaitan dengan lingkungan sekolah."}, {"no": 6, "kisi": "Struktur Identifikasi", "svg": "", "q": "Berikut ini pernyataan yang tepat untuk mengisi bagian struktur <strong>identifikasi</strong> pada teks deskripsi tentang 'Kucing Peliharaanku' adalah ....", "options": ["Setiap pagi Milo selalu mengeong pelan di depan pintu kamarku meminta makan.", "Bulunya berwarna putih bersih selembut kapas dengan ekor yang panjang mengembang.", "Kehadiran Milo membuat suasana rumah kami menjadi jauh lebih ceria setiap hari.", "Aku memiliki kucing persia bernama Milo yang kuadopsi sejak tiga bulan lalu."], "ans": 3, "exp": "Identifikasi memuat pengenalan awal objek secara umum (nama, jenis, dan asal-usulnya). Pilihan B dan C adalah deskripsi bagian, sedangkan D adalah simpulan/kesan."}, {"no": 7, "kisi": "Informasi Tersurat", "svg": "", "q": "Bacalah teks berikut!<br><em>\"Tari Saman berasal dari dataran tinggi Gayo, Provinsi Aceh. Tarian ini biasanya ditampilkan untuk merayakan peristiwa-peristiwa penting dalam adat. Syair dalam tarian Saman mempergunakan bahasa Gayo dan gerakannya mengandalkan kekompakan tepuk tangan serta tepuk dada para penari.\"</em><br>Informasi tersurat yang sesuai dengan isi teks di atas adalah ....", "options": ["Tari Saman berasal dari daerah pesisir Sumatera Utara", "Syair pengiring tari Saman menggunakan bahasa Gayo", "Gerakan tari Saman diiringi alat musik gamelan lengkap", "Tari Saman hanya boleh ditarikan oleh penari perempuan"], "ans": 1, "exp": "Informasi tersurat tertulis langsung pada kalimat ketiga: 'Syair dalam tarian Saman mempergunakan bahasa Gayo'."}, {"no": 8, "kisi": "Kata Depan", "svg": "", "q": "Penulisan kata depan <em>di</em> yang tepat sesuai kaidah ejaan Bahasa Indonesia terdapat pada kalimat ....", "options": ["Wisatawan berkumpul di pelataran candi sebelum matahari terbit.", "Festival budaya tahunan akan diselenggarakan dibulan November.", "Buku catatan perjalanan wisata itu disimpan didalam tas ransel.", "Pemandangan alam pegunungan itu sangat indah dipandang mata."], "ans": 0, "exp": "Kata depan 'di' ditulis terpisah jika menunjukkan tempat ('di pelataran'). 'Dipandang' dan 'diselenggarakan' adalah imbuhan (digabung), sedangkan 'di dalam' harus dipisah."}, {"no": 9, "kisi": "Ciri Teks Deskripsi", "svg": "", "q": "Perhatikan ciri-ciri teks berikut:<br>1) Menggambarkan objek secara khusus dan mendetail<br>2) Berisi langkah-langkah melakukan suatu kegiatan<br>3) Melibatkan kesan indra (penglihatan, pendengaran, perabaan)<br>4) Menggunakan tokoh dan alur konflik yang menegangkan<br>Ciri utama teks deskripsi ditunjukkan oleh nomor ....", "options": ["3 dan 4", "1 dan 2", "1 dan 3", "2 dan 4"], "ans": 2, "exp": "Teks deskripsi bersifat spesifik/mendetail (1) dan melibatkan citraan pancaindra (3). Nomor 2 ciri teks prosedur, nomor 4 ciri teks narasi."}, {"no": 10, "kisi": "Majas Personifikasi", "svg": "", "q": "Kalimat di bawah ini yang menggunakan majas personifikasi adalah ....", "options": ["Angin pantai berbisik lembut membelai dedaunan nyiur di tepi laut.", "Suaranya menggelegar membelah angkasa saat meneriakkan semangat.", "Kota pelajar itu selalu ramai dikunjungi wisatawan setiap akhir pekan.", "Wajahnya bersinar bagaikan bulan purnama di malam yang cerah."], "ans": 0, "exp": "Majas personifikasi memberikan sifat manusia kepada benda mati. 'Angin berbisik lembut membelai' mengumpamakan angin seolah manusia."}, {"no": 11, "kisi": "Majas Hiperbola", "svg": "", "q": "Bacalah kalimat berikut!<br><em>\"Ayah membanting tulang memeras keringat demi menyekolahkan anak-anaknya hingga ke perguruan tinggi.\"</em><br>Majas yang terkandung dalam kalimat tersebut adalah ....", "options": ["Litotes", "Personifikasi", "Hiperbola", "Simile"], "ans": 2, "exp": "Majas hiperbola mengungkapkan sesuatu secara melebih-lebihkan kenyataan ('membanting tulang memeras keringat') untuk menekankan kerja keras."}, {"no": 12, "kisi": "Ciri & Syarat Pantun", "svg": "", "q": "Berikut ini yang merupakan ciri dan syarat utama sebuah pantun adalah ....", "options": ["Satu bait terdiri atas 4 larik, bersajak a-b-a-b, dan setiap larik terdiri atas 8–12 suku kata", "Satu bait terdiri atas 4 larik, bersajak a-a-a-a, dan seluruh lariknya merupakan isi", "Satu bait terdiri atas 2 larik, bersajak a-a, dan keduanya merupakan hubungan sebab akibat", "Satu bait terdiri atas 6 larik, bersajak bebas, dan berisi kisah kepahlawanan"], "ans": 0, "exp": "Syarat pantun: 1 bait = 4 baris (larik), rima akhir a-b-a-b, panjang 8–12 suku kata per larik, baris 1-2 sampiran, baris 3-4 isi."}, {"no": 13, "kisi": "Sampiran, Isi dan Rima Pantun", "svg": "", "q": "Perhatikan pantun berikut!<br><em>Berakit-rakit ke hulu,<br>Berenang-renang ke tepian.<br>Bersakit-sakit dahulu,<br>Bersenang-senang kemudian.</em><br>Berdasarkan struktur pantun di atas, larik pertama dan kedua disebut ....", "options": ["Bait", "Isi", "Amanat", "Sampiran"], "ans": 3, "exp": "Dalam pantun, dua larik pertama (baris ke-1 dan ke-2) berfungsi sebagai sampiran untuk mengantarkan rima, sedangkan larik ke-3 dan ke-4 adalah isi."}, {"no": 14, "kisi": "Urutan Larik Pantun", "svg": "", "q": "Perhatikan larik-larik pantun yang diacak berikut!<br>1) Rajinlah belajar sepanjang hayat<br>2) Pergi ke pasar membeli manggis<br>3) Supaya kelak hidup bahagia<br>4) Manggis dibeli untuk dibawa<br>Urutan larik yang tepat agar menjadi pantun yang padu adalah ....", "options": ["4 - 2 - 3 - 1", "1 - 3 - 2 - 4", "2 - 4 - 1 - 3", "2 - 1 - 4 - 3"], "ans": 2, "exp": "Larik 2 (manggis - is) berima dengan larik 1 (hayat - at? Cek rima: dibawa [a] - bahagia [a]). Larik 2 & 4 adalah sampiran (manggis/dibawa), larik 1 & 3 adalah isi (hayat/bahagia)."}, {"no": 15, "kisi": "Makna atau Amanat Pantun", "svg": "", "q": "Bacalah pantun berikut!<br><em>Buah cempedak di luar pagar,<br>Ambil galah tolong jolokkan.<br>Saya budak baru belajar,<br>Kalau salah tolong tunjukkan.</em><br>Amanat yang terkandung dalam pantun tersebut adalah ....", "options": ["Setiap anak harus menanam pohon buah di sekitar pagar rumah", "Gunakanlah galah yang panjang ketika memetik buah di kebun", "Jangan malu meminta bimbingan dan koreksi saat sedang belajar hal baru", "Orang yang pandai tidak perlu lagi mendengarkan nasihat orang lain"], "ans": 2, "exp": "Isi pantun ('Saya budak baru belajar, kalau salah tolong tunjukkan') mengajarkan kerendahan hati untuk mau dibimbing saat belajar."}, {"no": 16, "kisi": "Nasihat dalam Gurindam", "svg": "", "q": "Perhatikan gurindam berikut!<br><em>Barang siapa tiada memegang agama,<br>Sekali-kali tiada boleh dibilangkan nama.</em><br>Nasihat yang terkandung dalam kutipan gurindam tersebut adalah ....", "options": ["Setiap orang bebas menentukan aturan hidup tanpa pedoman agama", "Seseorang harus menghafal banyak nama tokoh agama terkenal", "Nama baik seseorang hanya ditentukan oleh kekayaan hartanya", "Agama merupakan pedoman utama yang memuliakan martabat hidup manusia"], "ans": 3, "exp": "Gurindam Pasal 1 karya Raja Ali Haji tersebut menasihati bahwa agama adalah fondasi utama kehidupan; tanpa agama manusia kehilangan kehormatan."}, {"no": 17, "kisi": "Ciri atau Struktur Gurindam", "svg": "", "q": "Perbedaan mendasar antara struktur gurindam dan pantun adalah ....", "options": ["Gurindam tidak terikat jumlah baris dan tidak mengandung nasihat moral", "Gurindam terdiri atas 2 larik bersajak a-a yang seluruhnya merupakan isi (sebab-akibat)", "Gurindam terdiri atas 4 larik bersajak a-b-a-b dengan sampiran di awal", "Gurindam memiliki 4 larik bersajak a-a-a-a dan tidak memiliki rima akhir"], "ans": 1, "exp": "Gurindam merupakan puisi lama dua seuntai (2 larik per bait), berima a-a, larik 1 berupa syarat/sebab dan larik 2 berupa jawaban/akibat."}, {"no": 18, "kisi": "Sampiran Pantun", "svg": "", "q": "Perhatikan pantun rumpang berikut!<br><em>................................................<br>................................................<br>Kalau kamu rajin membaca,<br>Ilmu bertambah wawasan luas.</em><br>Sampiran yang tepat untuk melengkapi pantun tersebut adalah ....", "options": ["Beli baju berwarna biru, / Dipakai pergi ke rumah teman.", "Pergi ke kebun memetik mangga, / Mangga manis dimakan berdua.", "Air mengalir ke dalam kolam, / Ikan berenang sangat gembira.", "Jalan-jalan ke Kota Blitar, / Jangan lupa membeli nanas."], "ans": 3, "exp": "Baris ke-3 berakhir bunyi '-ca' (membaca) dan baris ke-4 berakhir bunyi '-as' (luas). Sampiran yang rima akhirnya bersesuaian adalah 'Blitar' (-ar/-a) dan 'nanas' (-as)."}, {"no": 19, "kisi": "Urutan Larik Pantun", "svg": "", "q": "Susunlah larik-larik berikut menjadi pantun nasihat yang tepat!<br>1) Hendaklah hormat kepada guru<br>2) Sungguh harum bunga melati<br>3) Agar berkah ilmu yang didapat<br>4) Tumbuh mekar di tepi taman<br>Susunan yang benar adalah ....", "options": ["2 - 4 - 1 - 3", "1 - 2 - 3 - 4", "4 - 2 - 3 - 1", "2 - 1 - 4 - 3"], "ans": 0, "exp": "Larik 2 (melati) & 4 (taman) adalah sampiran tentang alam, sedangkan larik 1 (guru) & 3 (didapat) adalah isi berupa nasihat menghormati guru."}, {"no": 20, "kisi": "Tema Syair", "svg": "", "q": "Bacalah bait syair berikut!<br><em>Wahai ananda dengarlah madah,<br>Janganlah engkau berbuat salah,<br>Kepada orang tua jangan membantah,<br>Supaya hidupmu beroleh berkah.</em><br>Tema yang diangkat dalam penggalan syair tersebut adalah ....", "options": ["Keindahan alam negeri Melayu", "Persahabatan di tanah rantau", "Bakti anak kepada orang tua", "Perjuangan melawan penjajah"], "ans": 2, "exp": "Syair tersebut berfokus pada nasihat agar seorang anak tidak membantah perkataan orang tua demi meraih keberkahan hidup."}, {"no": 21, "kisi": "Makna Ungkapan atau Kiasan", "svg": "", "q": "Bacalah larik syair berikut!<br><em>Janganlah engkau berhati batu,<br>Nasihat baik dengarkan selalu.</em><br>Makna ungkapan <strong>berhati batu</strong> dalam larik syair tersebut adalah ....", "options": ["Sangat sabar menghadapi cobaan", "Tidak mudah terpengaruh rayuan", "Keras kepala dan sulit dinasihati", "Memiliki keberanian yang luar biasa"], "ans": 2, "exp": "Ungkapan 'berhati batu' bermakna kias keras kepala, tidak mau mendengar nasihat, atau tidak berperasaan."}, {"no": 22, "kisi": "Bahasa Kiasan", "svg": "", "q": "Dalam syair klasik sering ditemukan larik: <em>\"Ilmu itu pelita hati, penerang jalan di malam kelam.\"</em> Penggunaan kata <strong>pelita hati</strong> merupakan bentuk bahasa kiasan yang bermakna ....", "options": ["Perasaan sedih yang muncul saat malam tiba", "Harta benda yang disimpan untuk masa depan", "Petunjuk dan penerang kehidupan agar tidak tersesat", "Lampu minyak yang diletakkan di dalam ruangan gelap"], "ans": 2, "exp": "Pelita berarti lampu penerang. Secara kias, 'pelita hati' bermakna ilmu pengetahuan yang membimbing pikiran dan hati manusia menuju kebenaran."}, {"no": 23, "kisi": "Amanat Syair", "svg": "", "q": "Perhatikan syair berikut!<br><em>Carilah ilmu tiada jemu,<br>Sebagai bekal di hari tuamu,<br>Janganlah lalai membuang waktu,<br>Menyesal nanti tiada berguna.</em><br>Amanat yang ingin disampaikan penyair melalui bait tersebut adalah ....", "options": ["Menuntut ilmu hanya perlu dilakukan ketika seseorang sudah dewasa", "Gunakan waktu luang untuk beristirahat sepuasnya sebelum usia senja", "Bekerjalah sejak dini agar memiliki tabungan yang melimpah saat tua", "Manfaatkan waktu muda untuk tekun menuntut ilmu agar tidak menyesal di masa tua"], "ans": 3, "exp": "Syair mengajak pembaca untuk tidak menyia-nyiakan waktu dan terus belajar demi bekal kehidupan di masa depan."}, {"no": 24, "kisi": "Ciri Umum Cerita Fantasi", "svg": "", "q": "Salah satu ciri umum yang membedakan cerita fantasi dengan cerita pendek realistis adalah ....", "options": ["Mengandung unsur keajaiban, keanehan, dan kemisteriusan yang tidak terjadi di dunia nyata", "Latar waktu dan tempatnya hanya terbatas pada masa kini di lingkungan sekolah", "Seluruh peristiwa dalam cerita diambil dari catatan sejarah resmi", "Tokoh-tokoh dalam cerita selalu berasal dari kalangan ilmuwan modern"], "ans": 0, "exp": "Ciri khas utama cerita fantasi adalah adanya keajaiban/kemustahilan (sihir, lorong waktu, makhluk mitologi) yang tidak masuk akal di dunia nyata."}, {"no": 25, "kisi": "Struktur Cerita Fantasi", "svg": "", "q": "Urutan struktur teks cerita fantasi yang tepat adalah ....", "options": ["Identifikasi – Deskripsi Bagian – Simpulan", "Tujuan – Alat dan Bahan – Langkah-langkah", "Pernyataan Umum – Deretan Penjelas – Interpretasi", "Orientasi – Komplikasi – Resolusi"], "ans": 3, "exp": "Struktur teks cerita fantasi (narasi) terdiri atas orientasi (pengenalan), komplikasi (munculnya masalah hingga klimaks), dan resolusi (penyelesaian masalah)."}, {"no": 26, "kisi": "Keajaiban dalam Cerita Fantasi", "svg": "fantasi", "q": "Bacalah kutipan cerita berikut!<br><em>\"Begitu Arka menyentuh batu kristal biru di tengah hutan, tubuhnya tiba-tiba melayang dan tersedot masuk ke dalam gerbang cahaya ungu menu rosedur di bawah ini adalah ....", "options": ["Meskipun, walaupun, biarpun", "Kemudian, setelah itu, selanjutnya", "Tetapi, melainkan, sedangkan", "Karena, sebab, oleh karena itu"], "ans": 1, "exp": "Konjungsi temporal (urutan waktu) seperti 'kemudian', 'setelah itu', dan 'selanjutnya' digunakan untuk menandai urutan langkah dalam teks prosedur."}, {"no": 50, "kisi": "Kebahasaan Teks Prosedur (Keterangan Alat)", "svg": "", "q": "Kalimat petunjuk di bawah ini yang mengandung <strong>keterangan alat</strong> adalah ....", "options": ["Haluskan bumbu rempah menggunakan cobek dan ulekan batu.", "Diamkan adonan roti selama satu jam hingga mengembang.", "Tuangkan santan cair sedikit demi sedikit ke dalam panci.", "Lipat kertas origami menjadi dua bagian sama besar dengan rapi."], "ans": 0, "exp": "Frasa 'menggunakan cobek dan ulekan batu' menjelaskan alat yang dipakai untuk melakukan tindakan menghaluskan bumbu."}];

const letters = ['A', 'B', 'C', 'D'];
let userAnswers = new Array(QUESTIONS.length).fill(null);
let isSubmitted = false;

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  const navGrid = document.getElementById('nav-grid');
  container.innerHTML = '';
  navGrid.innerHTML = '';

  QUESTIONS.forEach((item, idx) => {
    // Render tombol navigasi samping
    const navBtn = document.createElement('button');
    navBtn.type = 'button';
    navBtn.className = 'nav-btn';
    navBtn.id = 'nav-' + idx;
    navBtn.textContent = item.no;
    navBtn.onclick = () => {
      document.getElementById('q-card-' + idx).scrollIntoView({ behavior: 'smooth' });
    };
    navGrid.appendChild(navBtn);

    // Render kartu soal
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'q-card-' + idx;

    const svgHtml = item.svg && SVGS[item.svg] ? SVGS[item.svg] : '';

    let optionsHtml = '';
    item.options.forEach((opt, optIdx) => {
      optionsHtml += `
        <label class="option-item" id="opt-${idx}-${optIdx}" onclick="selectOption(${idx}, ${optIdx})">
          <input type="radio" name="q_${idx}" id="radio-${idx}-${optIdx}" value="${optIdx}">
          <span class="opt-letter">${letters[optIdx]}.</span>
          <span>${opt}</span>
        </label>
      `;
    });

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Soal No. ${item.no}</span>
        <span class="q-kisi">${item.kisi}</span>
      </div>
      ${svgHtml}
      <div class="q-text">${item.q}</div>
      <div class="options-list">${optionsHtml}</div>
      <div class="explanation-box" id="exp-${idx}"></div>
    `;
    container.appendChild(card);
  });
}

function selectOption(qIdx, optIdx) {
  if (isSubmitted) return;
  userAnswers[qIdx] = optIdx;

  // Update visual pilihan
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`opt-${qIdx}-${i}`);
    const radio = document.getElementById(`radio-${qIdx}-${i}`);
    if (i === optIdx) {
      el.classList.add('selected');
      radio.checked = true;
    } else {
      el.classList.remove('selected');
      radio.checked = false;
    }
  }

  // Update navigasi samping
  const navBtn = document.getElementById('nav-' + qIdx);
  navBtn.classList.add('answered');

  updateProgress();
}

function updateProgress() {
  const answeredCount = userAnswers.filter(v => v !== null).length;
  document.getElementById('progress-badge').textContent = `Terjawab: ${answeredCount} / ${QUESTIONS.length}`;
  document.getElementById('side-count').textContent = `${answeredCount}/${QUESTIONS.length}`;
}

function submitQuiz() {
  const unanswered = userAnswers.filter(v => v === null).length;
  if (unanswered > 0) {
    const confirmSubmit = confirm(`Masih ada ${unanswered} soal yang belum dijawab. Apakah Anda yakin ingin mengumpulkan jawaban sekarang?`);
    if (!confirmSubmit) return;
  }

  isSubmitted = true;
  let correctCount = 0;
  let wrongCount = 0;

  QUESTIONS.forEach((item, idx) => {
    const userAns = userAnswers[idx];
    const correctAns = item.ans;
    const navBtn = document.getElementById('nav-' + idx);
    const expBox = document.getElementById('exp-' + idx);

    // Nonaktifkan radio button
    for (let i = 0; i < 4; i++) {
      document.getElementById(`radio-${idx}-${i}`).disabled = true;
      const optEl = document.getElementById(`opt-${idx}-${i}`);
      optEl.classList.remove('selected');
      if (i === correctAns) {
        optEl.classList.add('correct-opt');
      }
    }

    if (userAns === correctAns) {
      correctCount++;
      navBtn.classList.remove('answered');
      navBtn.classList.add('correct-nav');
      expBox.className = 'explanation-box exp-correct';
      expBox.innerHTML = `<strong>✔ Jawaban Anda Benar (${letters[correctAns]}).</strong><br><strong>Pembahasan:</strong> ${item.exp}`;
    } else {
      if (userAns !== null) {
        wrongCount++;
        document.getElementById(`opt-${idx}-${userAns}`).classList.add('wrong-opt');
      }
      navBtn.classList.remove('answered');
      navBtn.classList.add('wrong-nav');
      const userLabel = userAns !== null ? letters[userAns] : 'Tidak dijawab';
      expBox.className = 'explanation-box exp-wrong';
      expBox.innerHTML = `<strong>✘ Jawaban Anda: ${userLabel} | Kunci Jawaban: ${letters[correctAns]}.</strong><br><strong>Pembahasan:</strong> ${item.exp}`;
    }
    expBox.style.display = 'block';
  });

  const finalScore = Math.round((correctCount / QUESTIONS.length) * 100);
  document.getElementById('final-score').textContent = finalScore;
  document.getElementById('stat-correct').textContent = `Benar: ${correctCount}`;
  document.getElementById('stat-wrong').textContent = `Salah: ${wrongCount}`;
  document.getElementById('stat-empty').textContent = `Kosong: ${unanswered}`;

  let predikat = 'Terus Berlatih!';
  if (finalScore >= 90) predikat = 'Luar Biasa! Sangat Memuaskan!';
  else if (finalScore >= 75) predikat = 'Bagus! Sudah Melampaui Kriteria Ketuntasan.';
  else if (finalScore >= 60) predikat = 'Cukup Baik, Pelajari Kembali Pembahasan di Bawah.';

  document.getElementById('score-title').textContent = predikat;
  document.getElementById('score-desc').textContent = `Anda menjawab benar ${correctCount} dari ${QUESTIONS.length} soal. Silakan gulir ke bawah untuk membaca pembahasan setiap soal.`;

  const scorePanel = document.getElementById('score-panel');
  scorePanel.style.display = 'block';
  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'block';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuiz() {
  isSubmitted = false;
  userAnswers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('score-panel').style.display = 'none';
  document.getElementById('btn-submit').style.display = 'block';
  document.getElementById('btn-reset').style.display = 'none';
  renderQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
