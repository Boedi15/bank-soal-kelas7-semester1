<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan 50 Soal Informatika SMP Kelas VII (Set 2 — Bab 1–3, Surel &amp; Teknik Buku Paket)</title>
  <style>
    /* =====================================================================
       VARIABEL DESAIN & RESET (100% OFFLINE, TANPA KETERGANTUNGAN EKSTERNAL)
       ===================================================================== */
    :root {
      --bg-page: #eef2f6;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --border-soft: #e2e8f0;
      --primary: #0f4c81;
      --primary-hover: #0b3961;
      --primary-soft: #e8f1f8;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --success-border: #86efac;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --warning: #b45309;
      --warning-bg: #fffbeb;
      --warning-border: #fcd34d;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      line-height: 1.55;
    }

    /* =====================================================================
       HEADER RINGKAS
       ===================================================================== */
    .top-header {
      background: linear-gradient(135deg, #0b192c 0%, #0f4c81 65%, #1964a6 100%);
      color: #ffffff;
      padding: 18px 16px;
      box-shadow: var(--shadow-md);
    }

    .top-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(1.15rem, 2.3vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-meta {
      margin: 4px 0 0;
      font-size: 0.88rem;
      color: #dbeafe;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      min-height: 42px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-accent {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .btn-accent:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-subtle);
    }

    .btn-ghost {
      background-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-ghost:hover {
      background-color: rgba(255, 255, 255, 0.24);
    }

    /* =====================================================================
       LAYOUT DUA KOLOM: SOAL DI UTAMA & LIST NOMOR TETAP DI SAMPING
       ===================================================================== */
    .main-layout {
      max-width: 1280px;
      margin: 20px auto 48px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 24px;
      align-items: start;
    }

    /* Notifikasi Non-Blocking */
    .notice-bar {
      display: none;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background-color: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning);
      font-size: 0.9rem;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .notice-bar.visible {
      display: flex;
    }

    .notice-close {
      background: none;
      border: none;
      color: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      padding: 0 6px;
    }

    /* =====================================================================
       BANNER SKOR SETELAH SUBMIT
       ===================================================================== */
    .score-banner {
      display: none;
      background-color: var(--bg-card);
      border: 2px solid var(--primary);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }

    .score-banner.visible {
      display: block;
    }

    .score-banner-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .score-kicker {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
    }

    .score-value {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      font-weight: 800;
      line-height: 1.1;
      margin-top: 2px;
    }

    .score-desc {
      margin-top: 4px;
      font-size: 0.94rem;
      color: var(--text-secondary);
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat-card {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      text-align: center;
    }

    .stat-card.benar {
      background-color: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success);
    }

    .stat-card.salah {
      background-color: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger);
    }

    .stat-card.kosong {
      background-color: var(--warning-bg);
      border-color: var(--warning-border);
      color: var(--warning);
    }

    .stat-num {
      display: block;
      font-size: 1.45rem;
      font-weight: 800;
    }

    .stat-label {
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* =====================================================================
       KARTU SOAL
       ===================================================================== */
    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .question-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      scroll-margin-top: 18px;
    }

    .question-card.card-correct {
      border-color: var(--success-border);
      background-color: #fcfdfb;
    }

    .question-card.card-wrong {
      border-color: var(--danger-border);
      background-color: #fffcfc;
    }

    .question-card.card-unanswered {
      border-color: var(--warning-border);
    }

    .question-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .question-num {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--primary);
    }

    .question-tag {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-soft);
    }

    .question-prompt {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: pre-line;
    }

    /* Ilustrasi SVG */
    .svg-frame {
      margin: 0 0 16px;
      padding: 12px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .svg-frame svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .svg-caption {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Pilihan Jawaban */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .choice-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-sm);
      background-color: #ffffff;
      cursor: pointer;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .choice-label:hover {
      background-color: var(--bg-subtle);
      border-color: #7dd3fc;
    }

    .choice-label input[type="radio"] {
      margin-top: 3px;
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
      flex-shrink: 0;
      cursor: pointer;
    }

    .choice-label.picked {
      background-color: var(--primary-soft);
      border-color: var(--primary);
    }

    .choice-letter {
      font-weight: 700;
      color: var(--text-secondary);
      min-width: 20px;
    }

    .choice-text {
      flex: 1;
      font-size: 0.96rem;
    }

    .choice-label.choice-key {
      background-color: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
      font-weight: 600;
    }

    .choice-label.choice-key .choice-letter {
      color: var(--success);
    }

    .choice-label.choice-wrong {
      background-color: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .choice-label.choice-wrong .choice-letter {
      color: var(--danger);
    }

    /* Pembahasan */
    .explanation-panel {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--primary);
      background-color: var(--bg-subtle);
      font-size: 0.92rem;
    }

    .explanation-panel.show {
      display: block;
    }

    .explanation-panel.exp-ok {
      border-left-color: var(--success);
      background-color: var(--success-bg);
    }

    .explanation-panel.exp-bad {
      border-left-color: var(--danger);
      background-color: var(--danger-bg);
    }

    .explanation-panel.exp-empty {
      border-left-color: var(--warning);
      background-color: var(--warning-bg);
    }

    .explanation-head {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .explanation-body {
      margin: 0;
      color: var(--text-primary);
    }

    /* Panel Submit Bawah */
    .bottom-bar {
      margin-top: 24px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .bottom-status {
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    /* =====================================================================
       SIDEBAR TETAP (STICKY) DAFTAR NOMOR SOAL
       ===================================================================== */
    .sticky-sidebar {
      position: sticky;
      top: 16px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-md);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .sidebar-heading {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .count-badge {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background-color: var(--primary-soft);
      color: var(--primary);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.2s ease;
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid #cbd5e1;
      display: inline-block;
    }

    .swatch.done {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .swatch.ok {
      background-color: var(--success);
      border-color: var(--success);
    }

    .swatch.bad {
      background-color: var(--danger);
      border-color: var(--danger);
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }

    .num-btn {
      height: 36px;
      border-radius: 7px;
      border: 1px solid var(--border-soft);
      background-color: #ffffff;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.14s ease;
    }

    .num-btn:hover {
      border-color: var(--primary);
      background-color: var(--primary-soft);
    }

    .num-btn.is-done {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .num-btn.is-ok {
      background-color: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    .num-btn.is-bad {
      background-color: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .num-btn.is-empty {
      background-color: var(--warning-bg);
      border-color: var(--warning);
      color: var(--warning);
    }

    .sidebar-btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* =====================================================================
       RESPONSIVITAS MOBILE & TABLET
       ===================================================================== */
    @media (max-width: 960px) {
      .main-layout {
        grid-template-columns: 1fr;
      }

      .sticky-sidebar {
        position: static;
        max-height: none;
        overflow-y: visible;
        order: -1;
      }

      .number-grid {
        grid-template-columns: repeat(10, 1fr);
        gap: 6px;
      }

      .num-btn {
        height: 34px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 540px) {
      .question-card {
        padding: 15px;
      }

      .number-grid {
        gap: 5px;
      }

      .num-btn {
        height: 32px;
        font-size: 0.78rem;
      }

      .score-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="top-header">
    <div class="top-header-inner">
      <div>
        <h1 class="brand-title">Latihan 50 Soal Informatika SMP Kelas VII — Set 2</h1>
        <p class="brand-meta">Bab 1–3, Materi Surel &amp; Soal-Soal Teknik / Aktivitas Buku Paket Semester 1</p>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-accent" id="submitTopBtn">Kumpulkan &amp; Lihat Skor</button>
        <button type="button" class="btn btn-ghost" id="resetTopBtn">Acak Ulang &amp; Reset</button>
      </div>
    </div>
  </header>

  <main class="main-layout">
    <section aria-label="Halaman Soal Pilihan Ganda">
      <div class="notice-bar" id="noticeBox" role="alert">
        <span id="noticeMsg"></span>
        <button type="button" class="notice-close" id="closeNoticeBtn" aria-label="Tutup pemberitahuan">&times;</button>
      </div>

      <div class="score-banner" id="scoreBox" aria-live="polite">
        <div class="score-banner-top">
          <div>
            <div class="score-kicker">Rekapitulasi Nilai Akhir</div>
            <div class="score-value" id="finalScoreText">0 / 100</div>
            <div class="score-desc" id="finalFeedbackText">-</div>
          </div>
          <button type="button" class="btn btn-secondary" id="resetBannerBtn">Ulangi &amp; Acak Opsi Baru</button>
        </div>
        <div class="score-grid">
          <div class="stat-card benar">
            <span class="stat-num" id="countCorrect">0</span>
            <span class="stat-label">Jawaban Benar</span>
          </div>
          <div class="stat-card salah">
            <span class="stat-num" id="countWrong">0</span>
            <span class="stat-label">Jawaban Salah</span>
          </div>
          <div class="stat-card kosong">
            <span class="stat-num" id="countEmpty">0</span>
            <span class="stat-label">Tidak Dijawab</span>
          </div>
        </div>
      </div>

      <div class="questions-list" id="questionsRoot"></div>

      <div class="bottom-bar">
        <div class="bottom-status" id="bottomCounter">
          Status pengerjaan: <strong>0</strong> dari <strong>50</strong> soal terjawab.
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" id="resetBottomBtn">Reset Jawaban</button>
          <button type="button" class="btn btn-primary" id="submitBottomBtn">Kumpulkan Jawaban</button>
        </div>
      </div>
    </section>

    <aside class="sticky-sidebar" aria-label="Daftar Nomor Soal Tetap">
      <div class="sidebar-top">
        <h2 class="sidebar-heading">Nomor Soal</h2>
        <span class="count-badge" id="sidebarBadge">0 / 50</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="legend-row" id="legendBox">
        <span class="legend-chip"><span class="swatch"></span> Belum</span>
        <span class="legend-chip"><span class="swatch done"></span> Dijawab</span>
      </div>
      <div class="number-grid" id="numberGrid"></div>
      <div class="sidebar-btn-group">
        <button type="button" class="btn btn-primary" id="submitSideBtn">Kumpulkan &amp; Cek Pembahasan</button>
        <button type="button" class="btn btn-secondary" id="resetSideBtn">Acak Ulang &amp; Reset</button>
      </div>
    </aside>
  </main>

  <script>
    /**
     * =========================================================================
     * SET 2: 50 SOAL INFORMATIKA SMP KELAS VII (BAB 1-3, SUREL & TEKNIK BUKU)
     * Seluruh soal baru/berbeda dari Set 1, dilengkapi ilustrasi SVG pada soal

     */

      },
      {

        text: "Salah satu alasan Informatika menjadi cabang ilmu yang berdiri sendiri setelah berkembang lebih dari 20 tahun adalah...",
        svg: null,

        answer: "Membawa cara berpikir khas (computational thinking), konsepnya tahan lama, dan prinsip intinya dapat diajarkan tanpa bergantung pada teknologi tertentu",
        explanation: "Buku paket menjelaskan bahwa Informatika berdiri sebagai disiplin ilmu tersendiri karena memiliki cara berpikir unik (computational thinking), ide/konsep yang tahan lama, serta prinsip inti yang tidak bergantung pada teknologi tertentu."
      },
      {
        id: 3,
        topik: "Bab 1 • Industri 4.0 & Pekerjaan",

    // =========================================================================
    // STATE & PENGACAKAN DINAMIS KUNCI / OPSI JAWABAN
    // =========================================================================
    const CHOICE_LETTERS = ["A", "B", "C", "D"];
    let quizItems = [];
    let selectedByUser = {};
    let submittedState = false;

    const questionsRoot = document.getElementById("questionsRoot");
    const numberGrid = document.getElementById("numberGrid");
    const sidebarBadge = document.getElementById("sidebarBadge");
    const progressBar = document.getElementById("progressBar");
    const bottomCounter = document.getElementById("bottomCounter");
    const legendBox = document.getElementById("legendBox");
    const scoreBox = document.getElementById("scoreBox");
    const finalScoreText = document.getElementById("finalScoreText");
    const finalFeedbackText = document.getElementById("finalFeedbackText");
    const countCorrect = document.getElementById("countCorrect");
    const countWrong = document.getElementById("countWrong");
    const countEmpty = document.getElementById("countEmpty");
    const noticeBox = document.getElementById("noticeBox");
    const noticeMsg = document.getElementById("noticeMsg");

    /**
     * Mengacak array secara acak merata (Fisher-Yates).
     */
    function shuffleList(arr) {
      const clone = arr.slice();
      for (let i = clone.length - 1; i > 0; i--) {
        const randIdx = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[randIdx]] = [clone[randIdx], clone[i]];
      }
      return clone;
    }

    function openNotice(text) {
      noticeMsg.textContent = text;
      noticeBox.classList.add("visible");
      noticeBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function closeNotice() {
      noticeBox.classList.remove("visible");
    }

    /**
     * Menyiapkan ulang seluruh soal dengan urutan pilihan jawaban yang diacak
     * sehingga posisi kunci jawaban (A/B/C/D) tidak tetap dan berubah tiap sesi/reset.
     */
    function buildShuffledQuiz() {
      quizItems = QUESTIONS_SET_2.map((item) => {
        const randomized = shuffleList(item.options);
        const correctLetterIdx = randomized.indexOf(item.answer);
        return {
          ...item,
          randomizedOptions: randomized,
          currentKeyLetter: CHOICE_LETTERS[correctLetterIdx] || ""
        };
      });
    }

    function renderQuiz() {
      questionsRoot.innerHTML = "";
      numberGrid.innerHTML = "";

      quizItems.forEach((q) => {
        const card = document.createElement("article");
        card.className = "question-card";
        card.id = `card-q-${q.id}`;
        card.setAttribute("aria-label", `Pertanyaan nomor ${q.id}`);

        const meta = document.createElement("div");
        meta.className = "question-meta";
        meta.innerHTML = `
          <span class="question-num">Nomor ${q.id}</span>
          <span class="question-tag">${q.topik}</span>
        `;
        card.appendChild(meta);

        const prompt = document.createElement("p");
        prompt.className = "question-prompt";
        prompt.textContent = q.text;
        card.appendChild(prompt);

        if (q.svg) {
          const frame = document.createElement("div");
          frame.className = "svg-frame";
          frame.innerHTML = `
            ${q.svg}
            <div class="svg-caption">Ilustrasi Soal No. ${q.id}</div>
          `;
          card.appendChild(frame);
        }

        const choicesBox = document.createElement("div");
        choicesBox.className = "choices";
        choicesBox.id = `choices-q-${q.id}`;

        q.randomizedOptions.forEach((optStr, idx) => {
          const letter = CHOICE_LETTERS[idx] || String(idx + 1);
          const inputId = `q${q.id}_choice${idx}`;

          const lbl = document.createElement("label");
          lbl.className = "choice-label";
          lbl.htmlFor = inputId;
          lbl.dataset.value = optStr;

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = `q_${q.id}`;
          radio.id = inputId;
          radio.value = optStr;
          radio.checked = selectedByUser[q.id] === optStr;
          radio.disabled = submittedState;

          if (radio.checked) {
            lbl.classList.add("picked");
          }

          radio.addEventListener("change", () => {
            if (submittedState) return;
            selectedByUser[q.id] = optStr;
            refreshChoiceHighlight(q.id);
            refreshProgress();
          });

          const letterSpan = document.createElement("span");
          letterSpan.className = "choice-letter";
          letterSpan.textContent = `${letter}.`;

          const textSpan = document.createElement("span");
          textSpan.className = "choice-text";
          textSpan.textContent = optStr;

          lbl.appendChild(radio);
          lbl.appendChild(letterSpan);
          lbl.appendChild(textSpan);
          choicesBox.appendChild(lbl);
        });

        card.appendChild(choicesBox);

        const expPanel = document.createElement("div");
        expPanel.className = "explanation-panel";
        expPanel.id = `exp-q-${q.id}`;
        card.appendChild(expPanel);

        questionsRoot.appendChild(card);

        const navBtn = document.createElement("button");
        navBtn.type = "button";
        navBtn.className = "num-btn";
        navBtn.id = `nav-q-${q.id}`;
        navBtn.textContent = q.id;
        navBtn.title = `Ke Soal Nomor ${q.id}`;
        navBtn.addEventListener("click", () => {
          const el = document.getElementById(`card-q-${q.id}`);
          if (el) {
            el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
        numberGrid.appendChild(navBtn);
      });

      refreshProgress();
    }

    function refreshChoiceHighlight(qId) {
      const box = document.getElementById(`choices-q-${qId}`);
      if (!box) return;
      box.querySelectorAll(".choice-label").forEach((lbl) => {
        const inp = lbl.querySelector("input[type='radio']");
        lbl.classList.toggle("picked", Boolean(inp && inp.checked));
      });
    }

    function refreshProgress() {
      const total = QUESTIONS_SET_2.length;
      const done = Object.keys(selectedByUser).length;
      const percent = Math.round((done / total) * 100);

      sidebarBadge.textContent = `${done} / ${total}`;
      progressBar.style.width = `${percent}%`;
      bottomCounter.innerHTML = `Status pengerjaan: <strong>${done}</strong> dari <strong>${total}</strong> soal terjawab.`;

      if (!submittedState) {
        quizItems.forEach((q) => {
          const btn = document.getElementById(`nav-q-${q.id}`);
          if (!btn) return;
          btn.classList.remove("is-done", "is-ok", "is-bad", "is-empty");
          if (selectedByUser[q.id]) {
            btn.classList.add("is-done");
          }
        });
      }
    }

    function handleSubmitQuiz() {
      if (submittedState) {
        scoreBox.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      const answeredTotal = Object.keys(selectedByUser).length;
      if (answeredTotal < QUESTIONS_SET_2.length) {
        openNotice(
          `Kamu baru menjawab ${answeredTotal} dari ${QUESTIONS_SET_2.length} soal. Skor tetap dihitung; soal kosong ditandai dan pembahasannya tetap ditampilkan.`
        );
      } else {
        closeNotice();
      }

      submittedState = true;
      let okNum = 0;
      let badNum = 0;
      let emptyNum = 0;

      quizItems.forEach((q) => {
        const card = document.getElementById(`card-q-${q.id}`);
        const btn = document.getElementById(`nav-q-${q.id}`);
        const box = document.getElementById(`choices-q-${q.id}`);
        const expPanel = document.getElementById(`exp-q-${q.id}`);
        const chosen = selectedByUser[q.id];

        box.querySelectorAll("input[type='radio']").forEach((r) => {
          r.disabled = true;
        });

        box.querySelectorAll(".choice-label").forEach((lbl, idx) => {
          const optVal = lbl.dataset.value;
          const optLetter = CHOICE_LETTERS[idx] || "";
          lbl.classList.remove("picked");

          if (optVal === q.answer) {
            lbl.classList.add("choice-key");
            lbl.title = `Kunci Jawaban (${optLetter})`;
          } else if (chosen && optVal === chosen && optVal !== q.answer) {
            lbl.classList.add("choice-wrong");
          }
        });

        card.classList.remove("card-correct", "card-wrong", "card-unanswered");
        btn.classList.remove("is-done", "is-ok", "is-bad", "is-empty");
        expPanel.classList.remove("exp-ok", "exp-bad", "exp-empty");

        let statusTitle = "";
        if (!chosen) {
          emptyNum++;
          card.classList.add("card-unanswered");
          btn.classList.add("is-empty");
          expPanel.classList.add("exp-empty");
          statusTitle = `Belum Dijawab — Jawaban Benar (${q.currentKeyLetter}): ${q.answer}`;
        } else if (chosen === q.answer) {
          okNum++;
          card.classList.add("card-correct");
          btn.classList.add("is-ok");
          expPanel.classList.add("exp-ok");
          statusTitle = `Benar (${q.currentKeyLetter}) — ${q.answer}`;
        } else {
          badNum++;
          card.classList.add("card-wrong");
          btn.classList.add("is-bad");
          expPanel.classList.add("exp-bad");
          statusTitle = `Kurang Tepat — Jawaban Benar (${q.currentKeyLetter}): ${q.answer}`;
        }

        expPanel.innerHTML = `
          <div class="explanation-head">${statusTitle}</div>
          <p class="explanation-body"><strong>Pembahasan:</strong> ${q.explanation}</p>
        `;
        expPanel.classList.add("show");
      });

      const score = Math.round((okNum / QUESTIONS_SET_2.length) * 100);
      finalScoreText.textContent = `${score} / 100`;
      countCorrect.textContent = okNum;
      countWrong.textContent = badNum;
      countEmpty.textContent = emptyNum;

      if (score >= 85) {
        finalFeedbackText.textContent = "Hebat! Kamu menguasai materi Bab 1–3, Surel, dan teknik aktivitas buku paket dengan sangat baik.";
      } else if (score >= 70) {
        finalFeedbackText.textContent = "Cukup baik! Baca pembahasan pada soal yang salah lalu coba latihan ulang untuk hasil lebih tinggi.";
      } else {
        finalFeedbackText.textContent = "Ayo pelajari pembahasannya satu per satu agar konsep dan teknik pengerjaan soal makin dikuasai.";
      }

      legendBox.innerHTML = `
        <span class="legend-chip"><span class="swatch ok"></span> Benar</span>
        <span class="legend-chip"><span class="swatch bad"></span> Salah</span>
        <span class="legend-chip"><span class="swatch" style="background:#fffbeb;border-color:#b45309;"></span> Kosong</span>
      `;

      scoreBox.classList.add("visible");
      scoreBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function handleResetQuiz() {
      selectedByUser = {};
      submittedState = false;
      closeNotice();
      scoreBox.classList.remove("visible");

      legendBox.innerHTML = `
        <span class="legend-chip"><span class="swatch"></span> Belum</span>
        <span class="legend-chip"><span class="swatch done"></span> Dijawab</span>
      `;

      buildShuffledQuiz();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("submitTopBtn").addEventListener("click", handleSubmitQuiz);
    document.getElementById("submitBottomBtn").addEventListener("click", handleSubmitQuiz);
    document.getElementById("submitSideBtn").addEventListener("click", handleSubmitQuiz);

    document.getElementById("resetTopBtn").addEventListener("click", handleResetQuiz);
    document.getElementById("resetBottomBtn").addEventListener("click", handleResetQuiz);
    document.getElementById("resetSideBtn").addEventListener("click", handleResetQuiz);
    document.getElementById("resetBannerBtn").addEventListener("click", handleResetQuiz);
    document.getElementById("closeNoticeBtn").addEventListener("click", closeNotice);

    buildShuffledQuiz();
    renderQuiz();
  </script>
