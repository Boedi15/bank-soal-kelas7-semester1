<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan Soal Informatika SMP Kelas VII - Semester 1 (Set 3)</title>
  <style>
    /* =====================================================================
       VARIABEL TEMA & GAYA MANDIRI OFFLINE (TANPA KETERGANTUNGAN CDN)
       ===================================================================== */
    :root {
      --bg-canvas: #eef3f8;
      --bg-surface: #ffffff;
      --bg-muted: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-faint: #64748b;
      --line-soft: #e2e8f0;
      --line-strong: #cbd5e1;
      --brand: #1e3a8a;
      --brand-bright: #2563eb;
      --brand-hover: #1d4ed8;
      --brand-tint: #eff6ff;
      --ok: #15803d;
      --ok-bg: #f0fdf4;
      --ok-line: #86efac;
      --bad: #b91c1c;
      --bad-bg: #fef2f2;
      --bad-line: #fca5a5;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-line: #fcd34d;
      --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-float: 0 8px 24px rgba(15, 23, 42, 0.09);
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --font-ui: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-ui);
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.55;
    }

    /* =====================================================================
       HEADER RINGKAS
       ===================================================================== */
    .app-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 58%, #2563eb 100%);
      color: #ffffff;
      padding: 18px 16px;
      box-shadow: var(--shadow-float);
    }

    .app-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-title {
      margin: 0;
      font-size: clamp(1.12rem, 2.3vw, 1.55rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .app-subtitle {
      margin: 4px 0 0;
      font-size: 0.88rem;
      color: #dbeafe;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--r-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      min-height: 42px;
      transition: background-color 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-submit {
      background-color: #ffffff;
      color: var(--brand);
      border-color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #eff6ff;
    }

    .btn-primary {
      background-color: var(--brand-bright);
      color: #ffffff;
      border-color: var(--brand-bright);
    }

    .btn-primary:hover {
      background-color: var(--brand-hover);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--text-main);
      border-color: var(--line-strong);
    }

    .btn-secondary:hover {
      background-color: var(--bg-muted);
    }

    .btn-ghost {
      background-color: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.32);
    }

    .btn-ghost:hover {
      background-color: rgba(255, 255, 255, 0.24);
    }

    /* =====================================================================
       TATA LETAK DUA KOLOM: AREA SOAL + PANEL NOMOR TETAP (STICKY)
       ===================================================================== */
    .quiz-shell {
      max-width: 1280px;
      margin: 20px auto 52px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 312px;
      gap: 24px;
      align-items: start;
    }

    /* Kotak Pesan Non-Blocking */
    .alert-banner {
      display: none;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: var(--r-sm);
      background-color: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: var(--warn);
      font-size: 0.9rem;
      font-weight: 600;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .alert-banner.visible {
      display: flex;
    }

    .alert-dismiss {
      background: none;
      border: none;
      color: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      padding: 0 6px;
    }

    /* =====================================================================
       RINGKASAN SKOR SETELAH SUBMIT
       ===================================================================== */
    .result-card {
      display: none;
      background-color: var(--bg-surface);
      border: 2px solid var(--brand-bright);
      border-radius: var(--r-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-float);
    }

    .result-card.visible {
      display: block;
    }

    .result-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .result-kicker {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand-bright);
    }

    .result-score {
      font-size: clamp(1.9rem, 4vw, 2.65rem);
      font-weight: 800;
      line-height: 1.1;
      margin-top: 2px;
    }

    .result-note {
      margin-top: 4px;
      font-size: 0.94rem;
      color: var(--text-sub);
    }

    .result-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .metric-box {
      padding: 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line-soft);
      text-align: center;
    }

    .metric-box.m-correct {
      background-color: var(--ok-bg);
      border-color: var(--ok-line);
      color: var(--ok);
    }

    .metric-box.m-wrong {
      background-color: var(--bad-bg);
      border-color: var(--bad-line);
      color: var(--bad);
    }

    .metric-box.m-blank {
      background-color: var(--warn-bg);
      border-color: var(--warn-line);
      color: var(--warn);
    }

    .metric-num {
      display: block;
      font-size: 1.45rem;
      font-weight: 800;
    }

    .metric-lbl {
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* =====================================================================
       KARTU SOAL & PILIHAN GANDA
       ===================================================================== */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .q-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--r-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
      scroll-margin-top: 16px;
    }

    .q-card.state-correct {
      border-color: var(--ok-line);
      background-color: #fcfdfb;
    }

    .q-card.state-wrong {
      border-color: var(--bad-line);
      background-color: #fffcfc;
    }

    .q-card.state-blank {
      border-color: var(--warn-line);
    }

    .q-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .q-number {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--brand);
    }

    .q-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background-color: var(--bg-muted);
      color: var(--text-sub);
      border: 1px solid var(--line-soft);
    }

    .q-text {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
      white-space: pre-line;
    }

    /* Ilustrasi SVG */
    .svg-box {
      margin: 0 0 16px;
      padding: 12px;
      background-color: var(--bg-muted);
      border: 1px solid var(--line-soft);
      border-radius: var(--r-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .svg-box svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .svg-sub {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--text-faint);
      text-align: center;
    }

    /* Opsi Jawaban */
    .option-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .option-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      border: 1.5px solid var(--line-soft);
      border-radius: var(--r-sm);
      background-color: #ffffff;
      cursor: pointer;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .option-row:hover {
      background-color: var(--bg-muted);
      border-color: #93c5fd;
    }

    .option-row input[type="radio"] {
      margin-top: 3px;
      width: 17px;
      height: 17px;
      accent-color: var(--brand-bright);
      flex-shrink: 0;
      cursor: pointer;
    }

    .option-row.chosen {
      background-color: var(--brand-tint);
      border-color: var(--brand-bright);
    }

    .opt-key {
      font-weight: 700;
      color: var(--text-sub);
      min-width: 20px;
    }

    .opt-label-text {
      flex: 1;
      font-size: 0.96rem;
    }

    .option-row.opt-correct-key {
      background-color: var(--ok-bg);
      border-color: var(--ok);
      color: var(--ok);
      font-weight: 600;
    }

    .option-row.opt-correct-key .opt-key {
      color: var(--ok);
    }

    .option-row.opt-wrong-pick {
      background-color: var(--bad-bg);
      border-color: var(--bad);
      color: var(--bad);
    }

    .option-row.opt-wrong-pick .opt-key {
      color: var(--bad);
    }

    /* Pembahasan Lengkap per Soal */
    .solution-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: var(--r-sm);
      border-left: 4px solid var(--brand-bright);
      background-color: var(--bg-muted);
      font-size: 0.92rem;
    }

    .solution-box.visible {
      display: block;
    }

    .solution-box.sol-ok {
      border-left-color: var(--ok);
      background-color: var(--ok-bg);
    }

    .solution-box.sol-bad {
      border-left-color: var(--bad);
      background-color: var(--bad-bg);
    }

    .solution-box.sol-blank {
      border-left-color: var(--warn);
      background-color: var(--warn-bg);
    }

    .solution-heading {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .solution-detail {
      margin: 0;
      color: var(--text-main);
    }

    /* Panel Submit di Bawah */
    .footer-submit-box {
      margin-top: 24px;
      background-color: var(--bg-surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--r-md);
      padding: 18px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-card);
    }

    .footer-progress {
      font-size: 0.92rem;
      color: var(--text-sub);
    }

    /* =====================================================================
       PANEL SAMPING TETAP (STICKY) DAFTAR NOMOR 1 - 50
       ===================================================================== */
    .sticky-panel {
      position: sticky;
      top: 16px;
      background-color: var(--bg-surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--r-md);
      padding: 16px;
      box-shadow: var(--shadow-float);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }

    .sticky-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .sticky-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .sticky-count {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background-color: var(--brand-tint);
      color: var(--brand-bright);
    }

    .bar-track {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--brand-bright);
      transition: width 0.2s ease;
    }

    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-soft);
    }

    .legend-entry {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid #cbd5e1;
      display: inline-block;
    }

    .dot.answered {
      background-color: var(--brand-bright);
      border-color: var(--brand-bright);
    }

    .dot.correct {
      background-color: var(--ok);
      border-color: var(--ok);
    }

    .dot.wrong {
      background-color: var(--bad);
      border-color: var(--bad);
    }

    .num-nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }

    .num-tile {
      height: 36px;
      border-radius: 7px;
      border: 1px solid var(--line-soft);
      background-color: #ffffff;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.14s ease;
    }

    .num-tile:hover {
      border-color: var(--brand-bright);
      background-color: var(--brand-tint);
    }

    .num-tile.tile-answered {
      background-color: var(--brand-bright);
      border-color: var(--brand-bright);
      color: #ffffff;
    }

    .num-tile.tile-ok {
      background-color: var(--ok);
      border-color: var(--ok);
      color: #ffffff;
    }

    .num-tile.tile-bad {
      background-color: var(--bad);
      border-color: var(--bad);
      color: #ffffff;
    }

    .num-tile.tile-blank {
      background-color: var(--warn-bg);
      border-color: var(--warn);
      color: var(--warn);
    }

    .sticky-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* =====================================================================
       RESPONSIVITAS MOBILE & TABLET
       ===================================================================== */
    @media (max-width: 960px) {
      .quiz-shell {
        grid-template-columns: 1fr;
      }

      /* Bar ringkas tetap (sticky) di bagian atas layar kecil */
      .sticky-panel {
        position: sticky;
        top: 6px;
        z-index: 30;
        max-height: none;
        overflow-y: visible;
        padding: 12px;
        order: -1;
      }

      .num-nav-grid {
        grid-template-columns: repeat(10, 1fr);
        gap: 5px;
        margin-bottom: 10px;
      }

      .num-tile {
        height: 30px;
        font-size: 0.78rem;
      }
    }

    @media (max-width: 540px) {
      .q-card {
        padding: 15px;
      }

      .result-metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header Langsung Halaman Soal -->
  <header class="app-header">
    <div class="app-header-inner">
      <div>
        <h1 class="app-title">Latihan Soal Informatika SMP Kelas VII - Semester 1 (Set 3)</h1>
        <p class="app-subtitle">50 Soal Pilihan Ganda (Bab 1–3 &amp; Surel) • Mode Latihan Offline Mandiri</p>
      </div>
      <div class="header-controls">
        <button type="button" class="btn btn-submit" id="btnSubmitTop">Kumpulkan / Submit Jawaban</button>
        <button type="button" class="btn btn-ghost" id="btnResetTop">Ulangi Latihan (Acak Ulang)</button>
      </div>
    </div>
  </header>

  <main class="quiz-shell">
    <section aria-label="Daftar Soal Pilihan Ganda">
      <div class="alert-banner" id="alertBanner" role="alert">
        <span id="alertText"></span>
        <button type="button" class="alert-dismiss" id="btnCloseAlert" aria-label="Tutup pesan">&times;</button>
      </div>

      <!-- Ringkasan Skor Setelah Submit -->
      <div class="result-card" id="resultCard" aria-live="polite">
        <div class="result-head">
          <div>
            <div class="result-kicker">Hasil Kumpulan Jawaban</div>
            <div class="result-score" id="scoreDisplay">0 / 100</div>
            <div class="result-note" id="scoreSummaryNote">-</div>
          </div>
          <button type="button" class="btn btn-secondary" id="btnResetFromResult">Ulangi Latihan (Acak Ulang)</button>
        </div>
        <div class="result-metrics">
          <div class="metric-box m-correct">
            <span class="metric-num" id="numCorrect">0</span>
            <span class="metric-lbl">Jawaban Benar</span>
          </div>
          <div class="metric-box m-wrong">
            <span class="metric-num" id="numWrong">0</span>
            <span class="metric-lbl">Jawaban Salah</span>
          </div>
          <div class="metric-box m-blank">
            <span class="metric-num" id="numBlank">0</span>
            <span class="metric-lbl">Tidak Terjawab</span>
          </div>
        </div>
      </div>

      <!-- 50 Kartu Soal -->
      <div class="question-list" id="questionList"></div>

      <!-- Tombol Submit di Bagian Bawah -->
      <div class="footer-submit-box">
        <div class="footer-progress" id="footerProgress">
          Terjawab: <strong>0</strong> dari <strong>50</strong> soal.
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn btn-secondary" id="btnResetBottom">Ulangi Latihan (Acak Ulang)</button>
          <button type="button" class="btn btn-primary" id="btnSubmitBottom">Kumpulkan / Submit Jawaban</button>
        </div>
      </div>
    </section>

    <!-- Panel Samping Tetap (Sticky) Nomor 1 sampai 50 -->
    <aside class="sticky-panel" aria-label="Daftar Nomor Soal 1 sampai 50">
      <div class="sticky-head">
        <h2 class="sticky-title">Nomor Soal (1–50)</h2>
        <span class="sticky-count" id="stickyCount">0 / 50</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="progressFill"></div>
      </div>
      <div class="legend-bar" id="legendBar">
        <span class="legend-entry"><span class="dot"></span> Belum</span>
        <span class="legend-entry"><span class="dot answered"></span> Sudah</span>
      </div>
      <div class="num-nav-grid" id="numNavGrid"></div>
      <div class="sticky-actions">
        <button type="button" class="btn btn-primary" id="btnSubmitSide">Kumpulkan / Submit Jawaban</button>
        <button type="button" class="btn btn-secondary" id="btnResetSide">Ulangi Latihan (Acak Ulang)</button>
      </div>
    </aside>
  </main>

  <script>
    /**
     * =========================================================================
     * SET 3: 50 SOAL BARU INFORMATIKA SMP KELAS VII SEMESTER 1
     * Cakupan:
     * - Soal 1–12 : Bab 1 (Informatika, Pilar, Masyarakat 5.0, Keterampilan Generik)
     * - Soal 13–26: Bab 2 (Berpikir Komputasional, Algoritma, Optimasi Penjadwalan,
     *                Struktur Data List, Kata Rahasia, Representasi Data, Peminjaman Ruang, Kayu)
     * - Soal 27–38: Bab 3 TIK (GUI/CLI/VUI, Folder/File/Ekstensi/Windows, Peramban & Search Engine)
     * - Soal 39–50: Materi Surel (POP3/IMAP, To/Cc/Bcc, Subject/Body/Compose/Sent,
     *                Reply/Forward, Etika Surel Formal, Gagal Kirim / Address Not Found / Spam / Penuh)
     * =========================================================================
     */
    const SET_3_QUESTIONS = [
      // ==================== BAB 1: INFORMATIKA & KETERAMPILAN GENERIK (1-12) ====================
      {
        id: 1,
        bab: "Bab 1 • Hakikat Informatika",
        text: "Dalam kurikulum Informatika SMP Kelas VII, tujuan utama mempelajari Informatika bukan sekadar mahir mengoperasikan satu program aplikasi, melainkan...",
        svg: null,
        options: [
          "Membentuk cara berpikir komputasional serta memahami prinsip dan perancangan sistem komputasi yang bertahan lama",
          "Menghafalkan seluruh tombol pintas pada satu merek komputer tertentu saja",
          "Menggantikan pelajaran bahasa, matematika, dan seni dengan mengetik di komputer",
          "Melatih kecepatan mengetik cepat tanpa memahami isi atau logika informasi"
        ],
        answer: "Membentuk cara berpikir komputasional serta memahami prinsip dan perancangan sistem komputasi yang bertahan lama",
        explanation: "Jawaban benar karena Informatika menekankan cara berpikir komputasional dan prinsip dasar sistem komputasi yang langgeng meskipun perangkat lunak berganti. Pilihan lain terlalu sempit karena hanya menekankan hafalan aplikasi, mengganti mapel lain, atau mengetik tanpa logika."
      },
      {
        id: 2,
        bab: "Bab 1 • Elemen Pengetahuan",
        text: "Perhatikan skema elemen pengetahuan Informatika berikut. Elemen 'Analisis Data (AD)' dan 'Algoritma dan Pemrograman (AP)' berada di bawah payung...",

    // =========================================================================
    // STATE APLIKASI & PENGACAKAN OPSI DINAMIS
    // =========================================================================
    const OPTION_KEYS = ["A", "B", "C", "D"];
    let activeQuestions = [];
    let userSelections = {};
    let hasSubmitted = false;

    const questionList = document.getElementById("questionList");
    const numNavGrid = document.getElementById("numNavGrid");
    const stickyCount = document.getElementById("stickyCount");
    const progressFill = document.getElementById("progressFill");
    const footerProgress = document.getElementById("footerProgress");
    const legendBar = document.getElementById("legendBar");
    const resultCard = document.getElementById("resultCard");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const scoreSummaryNote = document.getElementById("scoreSummaryNote");
    const numCorrect = document.getElementById("numCorrect");
    const numWrong = document.getElementById("numWrong");
    const numBlank = document.getElementById("numBlank");
    const alertBanner = document.getElementById("alertBanner");
    const alertText = document.getElementById("alertText");

    /**
     * Mengacak array dengan algoritma Fisher-Yates.
     */
    function shuffleChoices(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function showAlert(msg) {
      alertText.textContent = msg;
      alertBanner.classList.add("visible");
      alertBanner.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideAlert() {
      alertBanner.classList.remove("visible");
    }

    /**
     * Mengacak ulang urutan opsi A, B, C, D untuk setiap soal setiap kali dimuat atau direset.
     */
    function initShuffledQuestions() {
      activeQuestions = SET_3_QUESTIONS.map((q) => {
        const shuffled = shuffleChoices(q.options);
        const keyIndex = shuffled.indexOf(q.answer);
        return {
          ...q,
          shuffledOptions: shuffled,
          correctLetter: OPTION_KEYS[keyIndex] || "A"
        };
      });
    }

    /**
     * Merender seluruh 50 soal dan 50 tombol navigasi nomor pada panel tetap.
     */
    function renderQuizView() {
      questionList.innerHTML = "";
      numNavGrid.innerHTML = "";

      activeQuestions.forEach((q) => {
        const card = document.createElement("article");
        card.className = "q-card";
        card.id = `q-card-${q.id}`;
        card.setAttribute("aria-label", `Soal nomor ${q.id}`);

        const top = document.createElement("div");
        top.className = "q-top";
        top.innerHTML = `
          <span class="q-number">Soal No. ${q.id}</span>
          <span class="q-badge">${q.bab}</span>
        `;
        card.appendChild(top);

        const p = document.createElement("p");
        p.className = "q-text";
        p.textContent = q.text;
        card.appendChild(p);

        if (q.svg) {
          const svgBox = document.createElement("div");
          svgBox.className = "svg-box";
          svgBox.innerHTML = `
            ${q.svg}
            <div class="svg-sub">Ilustrasi Soal No. ${q.id}</div>
          `;
          card.appendChild(svgBox);
        }

        const group = document.createElement("div");
        group.className = "option-group";
        group.id = `opt-group-${q.id}`;

        q.shuffledOptions.forEach((optVal, idx) => {
          const letter = OPTION_KEYS[idx] || String(idx + 1);
          const radioId = `s3_q${q.id}_o${idx}`;

          const row = document.createElement("label");
          row.className = "option-row";
          row.htmlFor = radioId;
          row.dataset.optionVal = optVal;
          row.dataset.optionLetter = letter;

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = `set3_q_${q.id}`;
          radio.id = radioId;
          radio.value = optVal;
          radio.checked = userSelections[q.id] === optVal;
          radio.disabled = hasSubmitted;

          if (radio.checked) {
            row.classList.add("chosen");
          }

          radio.addEventListener("change", () => {
            if (hasSubmitted) return;
            userSelections[q.id] = optVal;
            syncChoiceStyle(q.id);
            syncProgress();
          });

          const keySpan = document.createElement("span");
          keySpan.className = "opt-key";
          keySpan.textContent = `${letter}.`;

          const txtSpan = document.createElement("span");
          txtSpan.className = "opt-label-text";
          txtSpan.textContent = optVal;

          row.appendChild(radio);
          row.appendChild(keySpan);
          row.appendChild(txtSpan);
          group.appendChild(row);
        });

        card.appendChild(group);

        const solBox = document.createElement("div");
        solBox.className = "solution-box";
        solBox.id = `sol-box-${q.id}`;
        card.appendChild(solBox);

        questionList.appendChild(card);

        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "num-tile";
        tile.id = `num-tile-${q.id}`;
        tile.textContent = q.id;
        tile.title = `Lompat ke Soal No. ${q.id}`;
        tile.addEventListener("click", () => {
          const targetCard = document.getElementById(`q-card-${q.id}`);
          if (targetCard) {
            targetCard.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
        numNavGrid.appendChild(tile);
      });

      syncProgress();
    }

    function syncChoiceStyle(qId) {
      const group = document.getElementById(`opt-group-${qId}`);
      if (!group) return;
      group.querySelectorAll(".option-row").forEach((row) => {
        const inp = row.querySelector("input[type='radio']");
        row.classList.toggle("chosen", Boolean(inp && inp.checked));
      });
    }

    function syncProgress() {
      const total = SET_3_QUESTIONS.length;
      const done = Object.keys(userSelections).length;
      const pct = Math.round((done / total) * 100);

      stickyCount.textContent = `${done} / ${total}`;
      progressFill.style.width = `${pct}%`;
      footerProgress.innerHTML = `Terjawab: <strong>${done}</strong> dari <strong>${total}</strong> soal.`;

      if (!hasSubmitted) {
        activeQuestions.forEach((q) => {
          const tile = document.getElementById(`num-tile-${q.id}`);
          if (!tile) return;
          tile.classList.remove("tile-answered", "tile-ok", "tile-bad", "tile-blank");
          if (userSelections[q.id]) {
            tile.classList.add("tile-answered");
          }
        });
      }
    }

    /**
     * Menghitung skor akhir dan menampilkan pembahasan lengkap untuk setiap soal.
     */
    function submitAnswers() {
      if (hasSubmitted) {
        resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      const answeredCount = Object.keys(userSelections).length;
      if (answeredCount < SET_3_QUESTIONS.length) {
        showAlert(
          `Kamu baru menjawab ${answeredCount} dari ${SET_3_QUESTIONS.length} soal. Nilai tetap dihitung dan pembahasan seluruh 50 soal tetap ditampilkan.`
        );
      } else {
        hideAlert();
      }

      hasSubmitted = true;
      let correctTotal = 0;
      let wrongTotal = 0;
      let blankTotal = 0;

      activeQuestions.forEach((q) => {
        const card = document.getElementById(`q-card-${q.id}`);
        const tile = document.getElementById(`num-tile-${q.id}`);
        const group = document.getElementById(`opt-group-${q.id}`);
        const solBox = document.getElementById(`sol-box-${q.id}`);
        const picked = userSelections[q.id];

        let pickedLetter = "-";
        group.querySelectorAll("input[type='radio']").forEach((r) => {
          r.disabled = true;
        });

        group.querySelectorAll(".option-row").forEach((row) => {
          const val = row.dataset.optionVal;
          const letter = row.dataset.optionLetter;
          row.classList.remove("chosen");

          if (picked && val === picked) {
            pickedLetter = letter;
          }

          if (val === q.answer) {
            row.classList.add("opt-correct-key");
          } else if (picked && val === picked && val !== q.answer) {
            row.classList.add("opt-wrong-pick");
          }
        });

        card.classList.remove("state-correct", "state-wrong", "state-blank");
        tile.classList.remove("tile-answered", "tile-ok", "tile-bad", "tile-blank");
        solBox.classList.remove("sol-ok", "sol-bad", "sol-blank");

        let heading = "";
        let choiceLine = "";

        if (!picked) {
          blankTotal++;
          card.classList.add("state-blank");
          tile.classList.add("tile-blank");
          solBox.classList.add("sol-blank");
          heading = `Belum Terjawab — Kunci Jawaban: ${q.correctLetter}. ${q.answer}`;
          choiceLine = `Pilihan kamu: tidak ada. Kunci yang benar: <strong>${q.correctLetter}</strong>.`;
        } else if (picked === q.answer) {
          correctTotal++;
          card.classList.add("state-correct");
          tile.classList.add("tile-ok");
          solBox.classList.add("sol-ok");
          heading = `Benar — Pilihan Kamu: ${pickedLetter}. ${q.answer}`;
          choiceLine = `Pilihan kamu <strong>${pickedLetter}</strong> sudah tepat.`;
        } else {
          wrongTotal++;
          card.classList.add("state-wrong");
          tile.classList.add("tile-bad");
          solBox.classList.add("sol-bad");
          heading = `Kurang Tepat — Pilihan Kamu: ${pickedLetter} | Kunci: ${q.correctLetter}. ${q.answer}`;
          choiceLine = `Pilihan kamu <strong>${pickedLetter}</strong> (${picked}), sedangkan kunci jawaban yang benar adalah <strong>${q.correctLetter}</strong>.`;
        }

        solBox.innerHTML = `
          <div class="solution-heading">${heading}</div>
          <p class="solution-detail">${choiceLine} ${q.explanation}</p>
        `;
        solBox.classList.add("visible");
      });

      const finalScore = Math.round((correctTotal / SET_3_QUESTIONS.length) * 100);
      scoreDisplay.textContent = `${finalScore} / 100`;
      numCorrect.textContent = correctTotal;
      numWrong.textContent = wrongTotal;
      numBlank.textContent = blankTotal;

      if (finalScore >= 85) {
        scoreSummaryNote.textContent = "Sangat baik! Pemahaman kamu pada Bab 1–3, Surel, dan teknik soal buku paket sudah kuat.";
      } else if (finalScore >= 70) {
        scoreSummaryNote.textContent = "Bagus! Cermati pembahasan pada soal yang masih kurang tepat lalu ulangi latihan.";
      } else {
        scoreSummaryNote.textContent = "Terus berlatih! Baca alasan benar dan salah pada tiap pembahasan lalu coba lagi.";
      }

      legendBar.innerHTML = `
        <span class="legend-entry"><span class="dot correct"></span> Benar</span>
        <span class="legend-entry"><span class="dot wrong"></span> Salah</span>
        <span class="legend-entry"><span class="dot" style="background:#fffbeb;border-color:#b45309;"></span> Kosong</span>
      `;

      resultCard.classList.add("visible");
      resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    /**
     * Mereset jawaban, menyembunyikan hasil & pembahasan, serta mengacak ulang posisi opsi A-D.
     */
    function resetPractice() {
      userSelections = {};
      hasSubmitted = false;
      hideAlert();
      resultCard.classList.remove("visible");

      legendBar.innerHTML = `
        <span class="legend-entry"><span class="dot"></span> Belum</span>
        <span class="legend-entry"><span class="dot answered"></span> Sudah</span>
      `;

      initShuffledQuestions();
      renderQuizView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("btnSubmitTop").addEventListener("click", submitAnswers);
    document.getElementById("btnSubmitBottom").addEventListener("click", submitAnswers);
    document.getElementById("btnSubmitSide").addEventListener("click", submitAnswers);

    document.getElementById("btnResetTop").addEventListener("click", resetPractice);
    document.getElementById("btnResetBottom").addEventListener("click", resetPractice);
    document.getElementById("btnResetSide").addEventListener("click", resetPractice);
    document.getElementById("btnResetFromResult").addEventListener("click", resetPractice);
    document.getElementById("btnCloseAlert").addEventListener("click", hideAlert);

    initShuffledQuestions();
    renderQuizView();
  </script>
